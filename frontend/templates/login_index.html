<html lang="en">
<!-- https://codepen.io/danielkvist/pen/LYNVyPL -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入字体图标 -->
    <link rel="stylesheet" href="../static/css/fonts/font.css">
    <link rel="stylesheet" href="../static/css/120.css">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" media="screen"
          href="https://cdn.staticfile.org/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
        {#height: 100%;#} width: 100%;
            align-items: center;
        {#background-color: var(--white);#} background-image: url("../static/image/bk.png");
            /* 决定背景图像的位置是在视口内固定，或者随着包含它的区块滚动。 */
            /* https://developer.mozilla.org/zh-CN/docs/Web/CSS/background-attachment */
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: grid;
            height: 100vh;
            place-items: center;
            opacity: 0.98;
        }

        .align-right {
            position: absolute;
            top: 10px; /* 调整按钮距离顶部的距离 */
            right: 10px; /* 调整按钮距离右边的距离 */
        }


    </style>
</head>

<body>
<!-- 为下拉菜单添加一个包装 <div> 元素 -->
<div class="dropdown align-right">
    <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#" role="button" aria-expanded="false"
       style="color: black;background-color: white;opacity: 0.95;border-radius: 20px">中文</a>
    <div class="dropdown-menu">
        <a class="dropdown-item" href="#one">英文</a>
    </div>
</div>
<div class="container" style="width: 400px;background-color: white;height: 370px;border-radius: 10px;">

    <div style="width: 100%;height: 50px;text-align: center;line-height: 50px;margin-top: 25px">
        <h2 style="color: #1b1e21">穗粒表型分析系统</h2>
    </div>
    <div style="width: 100%;margin-top:25px ">
        <form method="post" action="/">
            {% csrf_token %}
            <div class="input-group mb-3" style="margin-left: 10px;width: 95%">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="basic-addon1">用户名：</span>
                </div>
                <input type="text" class="form-control" placeholder="请输入注册时的用户名" name="user" id="user">
            </div>
            <div class="input-group mb-3" style="margin-top: 25px;margin-left: 10px;width: 95%">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="basic-addon1">密&nbsp;&nbsp;&nbsp;&nbsp;码：</span>
                </div>
                <input type="text" class="form-control" placeholder="请输入密码（区分大小写）" name="password" id="password">
            </div>
            {% if error_msg %}
                <span style="color: red; font-size: 16px; font-family: 黑体; width: 240px">{{ error_msg }}</span>
            {% endif %}
            <button type="submit" class="btn btn-success"
                    style="width: 100%;height: 50px;font-size: 20px;margin-top: 20px"
                    onclick="success()">登录
            </button>
        </form>

        <div style="display: flex;margin-top: 30px">
            <div style="float: left;margin-right: 70px">
                <a href="/register">没有账号？点击注册</a>
            </div>
            <div style="float: left;">
                <a href="javascript:void(0);" id="forgotPasswordLink" style="color: #6f42c1">忘记密码？点击找回</a>
            </div>

            <!-- 模态框（Modal） -->
            <div class="modal fade" id="forgotPasswordModal" tabindex="-1" role="dialog"
                 aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="forgotPasswordModalLabel">找回密码</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <!-- 在这里放置找回密码的表单 -->
                            <form id="forgotPasswordForm" action="/forget/" method="post">
                                {% csrf_token %}
                                <div class="input-group mb-3" style="margin: 10px;width: 95%">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"
                                              id="basic-addon1">用&nbsp;&nbsp;户&nbsp;&nbsp;名：</span>
                                    </div>
                                    <input type="text" class="form-control" placeholder="请输入注册时的用户名" name="username"
                                           id="username">
                                </div>
                                <div class="input-group mb-3" style="margin: 10px;width: 95%">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text" id="basic-addon1">电子邮箱：</span>
                                    </div>
                                    <input type="text" placeholder="请输入注册的电子邮箱" class="form-control" name="email"
                                           id="email"/>
                                </div>
                                <div id="forgrt_password" style="color: red; font-size:20px;margin: 20px">

                                </div>
                                <button type="submit" class="btn btn-primary" style="margin: 10px;width: 95%">找回密码
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script type="text/javascript" src="../static/js/jquery.min.js"></script>
<script type="text/javascript" src="../static/js/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script type="text/javascript" src="../static/js/bootstrap.js"></script>
<script>
    function success() {
        let username = document.getElementById("user").value;
        let password = document.getElementById("password").value;
        console.log(username, password)

        if (username === "" || password === "") {
            alert("请先输入账号和密码");
            return false;
        }
        // 验证密码长度是否在8-15位之间
        if (password.length < 8 || password.length > 15) {
            alert("密码长度必须在8-15位之间，检查是否输入有误");
            return false;
        }

        // 验证密码是否只包含数字、大写字母和小写字母
        let passwordPattern = /^[0-9A-Za-z]+$/;
        if (!passwordPattern.test(password)) {
            alert("密码只能包含数字、大写字母和小写字母");
            return false;
        }
        return true;


    }


</script>
<script>
    $('#forgotPasswordLink').click(function () {
        $('#username').val('');
        $('#email').val('');
        $('#forgrt_password').empty();
        $('#forgotPasswordModal').modal('show');
    });
    $('#forgotPasswordForm').submit(function (e) {
        e.preventDefault(); // 阻止表单的默认提交行为
        let username = document.getElementById("username").value;
        let email = document.getElementById("email").value;

        // 发送用户名和邮箱数据到后端
        $.ajax({
            url: "/forget/",
            type: "POST",
            data: {
                username: username,
                email: email
            },
            success: function (response) {
                // 处理后端的响应，例如显示成功消息或其他操作
                console.log(response.password);
                $('#forgrt_password').html(`您的密码是：${response.password}`);
                {#$('#forgotPasswordModal').modal('hide'); // 关闭模态框#}
            },

        });
    });

</script>
<!-- 在你的 HTML 文件中引入 Popper.js -->

</body>

</html>
