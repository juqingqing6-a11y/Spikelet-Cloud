<!DOCTYPE html>
<html lang="en">
<!-- https://codepen.io/danielkvist/pen/LYNVyPL -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
    <style>
        body {
            font-family: 宋体;
        }

        :root {
            /* COLORS */
            --white: #e9e9e9;
            --gray: #333;
            --blue: #0367a6;
            --lightblue: #008997;

            /* RADII */
            --button-radius: 0.7rem;

            /* SIZES */
            --max-width: 758px;
            --max-height: 420px;

            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
            Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        body {
            padding: 0;
            margin: 0;
        {#height: 100%;#} width: 100%;
            align-items: center;
            background-image: url("../static/image/bk.png");
            /* 决定背景图像的位置是在视口内固定，或者随着包含它的区块滚动。 */
            /* https://developer.mozilla.org/zh-CN/docs/Web/CSS/background-attachment */
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: grid;
            height: 100vh;
            place-items: center;
        }

        .form__title {
            font-weight: 300;
            margin: 0;
            margin-bottom: 1.25rem;
        }

        .link {
            color: var(--gray);
            font-size: 0.9rem;
            margin: 1.5rem 0;
            text-decoration: none;
        }

        .container {
            background-color: var(--white);
            border-radius: var(--button-radius);
            box-shadow: 0 0.9rem 1.7rem rgba(0, 0, 0, 0.25),
            0 0.7rem 0.7rem rgba(0, 0, 0, 0.22);
            height: 350px;
            max-width: 590px;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .container__form {
            height: 100%;
            position: absolute;
            top: 0;
            transition: all 0.6s ease-in-out;
        }

        .container--signin {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.right-panel-active .container--signin {
            transform: translateX(100%);
        }

        .container--signup {
            left: 0;
            opacity: 0;
            width: 50%;
            z-index: 1;
        }

        .container.right-panel-active .container--signup {
            animation: show 0.6s;
            opacity: 1;
            transform: translateX(100%);
            z-index: 5;
        }

        .container__overlay {
            height: 100%;
            left: 50%;
            overflow: hidden;
            position: absolute;
            top: 0;
            transition: transform 0.6s ease-in-out;
            width: 50%;
            z-index: 100;
        }

        .container.right-panel-active .container__overlay {
            transform: translateX(-100%);
        }

        .overlay {
            background-color: var(--lightblue);
            background-image: url("../static/image/a.webp");
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100%;
            left: -100%;
            position: relative;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            width: 200%;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay__panel {
            align-items: center;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            position: absolute;
            text-align: center;
            top: 0;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            width: 50%;
        }

        .overlay--left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay--left {
            transform: translateX(0);
        }

        .overlay--right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay--right {
            transform: translateX(20%);
        }

        .btn {
            background-color: var(--blue);
            background-image: linear-gradient(90deg, var(--blue) 0%, var(--lightblue) 74%);
            border-radius: 20px;
            border: 1px solid var(--blue);
            color: var(--white);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.1rem;
            padding: 0.9rem 4rem;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
        }

        .form > .btn {
            margin-top: 1.5rem;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:focus {
            outline: none;
        }

        .form {
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 3rem;
            height: 100%;
            text-align: center;
        }

        .input {
            background-color: #fff;
            border: none;
            padding: 0.9rem 0.9rem;
            margin: 0.5rem 0;
            width: 100%;
        }


    </style>
</head>

<body>
<div class="container right-panel-active">
    <!-- Sign Up -->
    <div class="container__form container--signup">
        <form class="form" id="form1" method="post">
            {% csrf_token %}
            <h2 class="form__title">注册</h2>
            <input type="text" placeholder="请输入用户名" class="input" name="user"/>

            {#            <input type="password" placeholder="密码的长度在8到15个字符" class="input" name="password"/>#}
            <input type="password" placeholder="密码的长度在8到15个字符" class="input" name="password" id="password"/>

            <span style="color: red; font-size: 15px; font-family: 黑体;width: 240px" id="passwordError"></span>

            <input type="email" placeholder="请输入正确的电子邮箱" class="input" name="email"/>
            <span style="color: red;font-size: 15px;font-family: 黑体">{{ error_msg }}</span>
            <button class="btn" id="registerButton">注册</button>
        </form>
    </div>


    <!-- Overlay -->
    <div class="container__overlay">
        <div class="overlay">
            <div class="overlay__panel overlay--left">
                <a class="btn" id="signIn" href="/" style="text-decoration: none">已有账号？点击登录</a>
            </div>

        </div>
    </div>
</div>


</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const passwordInput = document.getElementById("password");
        const passwordError = document.getElementById("passwordError");

        // 添加密码输入框的事件监听器
        passwordInput.addEventListener("blur", function () {
            const password = passwordInput.value;

            // 检查密码长度和包含大写字母、小写字母、数字的条件
            const isValid = password.length >= 8 && password.length <= 15 &&
                /[A-Z]/.test(password) && /[a-z]/.test(password) && /\d/.test(password);

            if (!isValid) {
                passwordError.textContent = "密码长度应在8到15个字符之间，且包含大写字母、小写字母和数字。";
                // 清空密码输入框
                passwordInput.value = "";
                // 添加抖动效果
                passwordInput.classList.add("shake");

                // 移除抖动效果
                setTimeout(function () {
                    passwordInput.classList.remove("shake");
                }, 500);
            } else {
                passwordError.textContent = "";
            }
        });
        // 添加注册按钮点击事件监听器
        registerButton.addEventListener("click", function (e) {
            const usernameInput = document.querySelector('input[name="user"]');
            const emailInput = document.querySelector('input[name="email"]');

            // 检查是否有任何一个输入框为空
            if (!usernameInput.value || !passwordInput.value || !emailInput.value) {
                e.preventDefault(); // 阻止默认提交行为
                alert("请正确注册，所有的输入框均不可为空！");
            }
        });
    });
</script>
</html>
