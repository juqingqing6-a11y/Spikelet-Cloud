<!DOCTYPE html>
<html>
<head>
    <title>Upload Image</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/static/css/research-theme.css?v=20261104-2">
    <script src="/static/js/research-ui.js?v=20261104-2" defer></script>
</head>
<body class="research-ui research-support">
<h1>Upload Image</h1>
<form method="post" style="width: 100%; height: 100%" id="form1"
      enctype="multipart/form-data">
    {% csrf_token %}
    <label for="file" id="add">
        点击上传
        <input id="file" name="file" class="filepath"
               onchange="handleSelected(this)"
               type="file"
               style="width: 100%; height: 100%; opacity: 0">
        <input id="reset-checkbox" type="checkbox" style="display: none">
    </label>
    <img id="img_upload_show" style="display: none; max-width: 100%; max-height: 100%">
</form>


<script type="text/javascript">
    let add = document.getElementById('add');
    let img = document.getElementById('img_upload_show');
    let resetCheckbox = document.getElementById('reset-checkbox');

    function handleSelected() {
        add.style.display = 'none';
        img.style.display = 'block';

        var e = window.event || arguments[0];
        let file = e.target.files[0];

        let reader = new FileReader();
        reader.onload = function (e) {
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

        resetCheckbox.checked = false;
    }

    function resetUpload() {
        let fileInput = document.getElementById('file');
        let add = document.getElementById('add');
        let img = document.getElementById('img_upload_show');

        fileInput.value = '';
        img.src = '';

        add.style.display = 'block';
        img.style.display = 'none';

        resetCheckbox.checked = false;
    }
</script>
</body>
</html>
